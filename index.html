        <span>🎓</span> <span id="uiSelectClassLabel">শ্ৰেণী বা পৰ্যায় বাছক:</span>

async function verifyAndLaunch() {
  const input = document.getElementById('geminiKeyInput');
  const feedback = document.getElementById('portalFeedback');
  const btn = document.getElementById('saveAndLaunchBtn');
  const key = input.value.trim();

  feedback.classList.remove('hidden');

  if (!key || key.length < 20) {
    feedback.className = "mt-3 p-2.5 rounded-xl text-xs font-bold bg-rose-100 text-rose-800 text-center";
    feedback.innerText = t('keyInvalid');
    return;
  }

  feedback.className = "mt-3 p-2.5 rounded-xl text-xs font-bold bg-amber-100 text-amber-800 text-center";
  feedback.innerText = t('verifyingKey');
  btn.disabled = true;

  try {
    // Pass key as both header and query param for full compatibility with AQ. and AIza keys
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`, {
      method: 'GET',
      headers: {
        'x-goog-api-key': key,
        'Content-Type': 'application/json'
      }
    });
    const data = await res.json();

    if (res.ok) {
      apiKey = key;
      localStorage.setItem('omnimath_gemini_key', key);
      sessionStorage.removeItem('omnimath_redirected');

      feedback.className = "mt-3 p-2.5 rounded-xl text-xs font-bold bg-emerald-100 text-emerald-800 text-center";
      feedback.innerText = t('keyValid');

      setTimeout(() => {
        document.getElementById('onboardingPortal').classList.add('hidden');
        btn.disabled = false;
        bootDashboard();
      }, 700);
    } else {
      btn.disabled = false;
      const apiErr = data.error?.message || `Error ${res.status}: ${res.statusText}`;
      feedback.className = "mt-3 p-2.5 rounded-xl text-xs font-bold bg-rose-100 text-rose-800 text-center break-words";
      feedback.innerText = apiErr;
    }
  } catch (err) {
    btn.disabled = false;
    feedback.className = "mt-3 p-2.5 rounded-xl text-xs font-bold bg-rose-100 text-rose-800 text-center break-words";
    feedback.innerText = err.message || "Network error reaching Google API";
  }
}

    function handleUniversalSearch(e) {
      const query = e.target.value.trim().toLowerCase();
      const dropdown = document.getElementById('searchResultsDropdown');

      if (query.length < 2) {
        dropdown.classList.add('hidden');
        dropdown.innerHTML = '';
        return;
      }

      const results = [];
      classesData.forEach(c => {
        c.chapters.forEach(ch => {
          const matchAs = ch.title.as.toLowerCase().includes(query) || ch.desc.as.toLowerCase().includes(query);
          const matchEn = ch.title.en.toLowerCase().includes(query) || ch.desc.en.toLowerCase().includes(query);
          if (matchAs || matchEn) {
            results.push({ ...ch, classTitle: c.title[currentLang] });
          }
        });
      });

      if (results.length === 0) {
        dropdown.innerHTML = `<div class="p-4 text-xs text-slate-500 text-center">কোনো ধাৰণা পোৱা নগ'ল / No concept found</div>`;

          } else if (cur > target) {
            feed.className = "text-xs font-bold h-5 text-rose-700";
            feed.innerText = currentLang === 'as' ? "অলপ বেছি হ’ল! পুনৰ চেষ্টা কৰক।" : "A bit over! Reset and try again.";
          }
        }
      } else if (mode === 'test') {
        const a = Math.floor(Math.random() * 6) + 2;
        const b = Math.floor(Math.random() * 5) + 3;
        const ans = a + b;
        body.innerHTML = `
          <div class="space-y-4">
            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200">
              <h4 class="text-lg font-black text-slate-900">${currentLang === 'as' ? 'সমীকৰণটো সমাধান কৰক:' : 'Solve the given equation:'}</h4>
              <div class="text-center text-xl font-bold my-3 font-mono">${toDigits(a)} + ${toDigits(b)} = ?</div>
            </div>
            <div class="flex gap-2">
              <input type="number" id="testAnsInput" placeholder="?" class="flex-1 p-3 border-2 border-slate-300 rounded-xl text-center text-lg font-bold" />
              <button id="testSubmitBtn" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-6 py-3 rounded-xl">${currentLang === 'as' ? 'উত্তৰ চাওক' : 'Check'}</button>
            </div>
            <div id="testRescueBox" class="hidden p-4 bg-amber-50 border-2 border-amber-300 rounded-2xl text-xs space-y-2">
              <h5 class="font-black text-amber-950 flex items-center gap-1.5 text-sm"><span>💡</span> <span>${t('rescueTitle')}</span></h5>
              <p class="text-amber-900">${t('tryAgainGuidance')}</p>
              <p class="font-mono bg-white p-2 rounded-lg border border-amber-200">${toDigits(a)} + ${toDigits(b)} = ${toDigits(a)} + (${toDigits(1)} + ${toDigits(b - 1)})</p>
            </div>
          </div>
        `;

        body.querySelector('#testSubmitBtn').onclick = () => {
          const val = parseInt(body.querySelector('#testAnsInput').value.trim(), 10);
          const r = body.querySelector('#testRescueBox');
          r.classList.remove('hidden');
          if (val === ans) {
            r.className = "p-4 bg-emerald-50 border-2 border-emerald-300 rounded-2xl text-xs text-emerald-900 font-bold";
            r.innerHTML = `<span>🌟 ${currentLang === 'as' ? 'শুদ্ধ সমাধান! আপুনি ধাৰণাটো আয়ত্ত কৰিলে।' : 'Correct! Concept fully mastered.'}</span>`;
          }
        };
      }

      if (window.renderMathInElement) {
        renderMathInElement(body, { delimiters: [{ left: '$$', right: '$$', display: true }] });
      }
    }

    function handleHwImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        currentHwImageBase64 = event.target.result.split(',')[1];
        document.getElementById('hwImagePreview').src = event.target.result;
        document.getElementById('hwImagePreviewContainer').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function clearHwImage() {
      currentHwImageBase64 = null;
      document.getElementById('hwImagePreviewContainer').classList.add('hidden');
      document.getElementById('hwCameraInput').value = '';
      document.getElementById('hwFileInput').value = '';
    }

    async function submitHomeworkQuery() {
      const text = document.getElementById('hwTextInput').value.trim();
      const output = document.getElementById('hwOutput');
      const btn = document.getElementById('askHwBtn');

      if (!text && !currentHwImageBase64) return;
      output.classList.remove('hidden');
      output.innerHTML = `<span class="animate-pulse font-bold text-amber-800">⚡ ${t('analyzingHw')}</span>`;
      btn.disabled = true;

      const langRule = currentLang === 'as' 
        ? "Respond purely and strictly in Assamese. Use formal terminology (যেনে: অৱকলজ, সমীকৰণ, ভগ্নাংশ). Do not include English sentences."
        : "Respond purely and strictly in English with professional mathematical clarity. Do not mix any other language.";

      let modeRule = currentHwType === "hint" 
        ? "Give only a concise conceptual clue and the formula. Do not provide final answer."
        : currentHwType === "step" 
        ? "Derive step-by-step using LaTeX syntax ($...$) for formulas."
        : "Evaluate student working. Explain where the logic slipped constructively.";

      const promptText = `OmniMath Guru. ${langRule} ${modeRule} Problem: ${text || "Please analyze attached image."}`;
      const contentsParts = [{ text: promptText }];
      if (currentHwImageBase64) {
        contentsParts.push({ inline_data: { mime_type: "image/jpeg", data: currentHwImageBase64 } });
      }
                const candidateModels = [
        'gemini-3.8-flash',
        'gemini-3.7-flash',
        'gemini-3.5-flash-lite',
        'gemini-2.5-flash',
        'gemini-2.0-flash'
      ];

      let candidateText = null;

      for (const model of candidateModels) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ contents: [{ parts: contentsParts }] })
          });

          if (!res.ok) continue;

          const data = await res.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) {
            candidateText = text;
            break;
          }
        } catch (e) {
          // Try next fallback model
        }
      }

      if (candidateText) {
        output.innerHTML = candidateText.replace(/\n/g, '<br/>');
        if (window.renderMathInElement) {
          renderMathInElement(output, { 
            delimiters: [
              { left: '$$', right: '$$', display: true }, 
              { left: '$', right: '$', display: false }
            ] 
          });
        }
      } else {
        output.innerHTML = `<span class="text-rose-700 font-bold">${currentLang === 'as' ? 'সংযোগত সমস্যা হ’ল। অনুগ্ৰহ কৰি পুনৰ চেষ্টা কৰক।' : 'Connection error. Please try again.'}</span>`;
      }
        btn.disabled = false;
      }
    }
    
    
  </script>
</body>
</html>
