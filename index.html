<!DOCTYPE html>
<html lang="as">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>গণিত পাঠশালা | Gonit Pathshala</title>

  <!-- Eruda Mobile Console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- KaTeX for Math -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Anek Bangla', 'Inter', sans-serif;
      touch-action: manipulation;
    }
    .katex-display {
      margin: 0.4em 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .active-hw-type {
      background-color: #fef3c7 !important;
      border-color: #f59e0b !important;
      color: #78350f !important;
    }
  </style>
</head>
<body class="bg-amber-50/40 text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-amber-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
        <span class="text-3xl">📐</span>
        <div>
          <h1 class="text-xl sm:text-2xl font-black tracking-tight leading-none" id="uiBrandTitle">গণিত পাঠশালা</h1>
          <p class="text-[10px] sm:text-xs text-amber-100 font-medium" id="uiBrandTagline">স্পৰ্শ কৰা, খেলা আৰু শিকা</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Built-in Refresh / Cache Buster Button -->
        <button onclick="forceAppRefresh()" 
                title="Refresh App & Clear Cache" 
                class="flex items-center gap-1 bg-amber-800/80 hover:bg-amber-900 text-white text-xs font-bold px-3 py-1.5 rounded-full border border-amber-400/40 shadow-xs active:scale-95 transition">
          <span>🔄</span>
          <span class="hidden sm:inline">Refresh</span>
        </button>

        <button id="langToggleBtn" class="bg-amber-700 hover:bg-amber-800 border border-amber-400 px-3 py-1.5 rounded-full text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
          <span>🌐</span>
          <span id="currentLangLabel">English</span>
        </button>

        <button id="openHwBtn" class="bg-amber-50 text-amber-900 hover:bg-white px-3.5 py-1.5 rounded-full text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
          <span>📷</span>
          <span id="uiHwNavText">ঘৰুৱা কাম</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- Universal Search Bar -->
    <div class="relative">
      <div class="flex items-center bg-white border-2 border-amber-300 rounded-2xl shadow-sm overflow-hidden focus-within:ring-4 focus-within:ring-amber-200 transition">
        <span class="pl-4 text-xl text-slate-400">🔍</span>
        <input type="text" id="conceptSearchInput" 
               placeholder="যিকোনো গাণিতিক ধাৰণা অনুসন্ধান কৰক (যেনে: ভগ্নাংশ, সমীকৰণ)..." 
               class="w-full px-3 py-3 text-sm sm:text-base focus:outline-none bg-transparent" />
      </div>
      <div id="searchResultsDropdown" class="hidden absolute left-0 right-0 top-full mt-2 bg-white rounded-2xl shadow-xl border border-amber-200 z-30 max-h-72 overflow-y-auto"></div>
    </div>

    <!-- Class Selector Dropdown -->
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 bg-amber-100/60 p-4 rounded-2xl border border-amber-200">
      <label for="classSelectDropdown" class="text-sm font-bold text-amber-950 flex items-center gap-2">
        <span>🎓</span> <span id="uiSelectClassLabel">শ্ৰেণী বা পৰ্যায় বাছক:</span>
      </label>
      <select id="classSelectDropdown" class="w-full sm:w-auto bg-white border-2 border-amber-300 text-slate-800 font-bold text-sm rounded-xl px-4 py-2.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
      </select>
    </div>

    <!-- Chapter Cards Grid -->
    <div id="chaptersContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    <!-- Interactive Workspace (Learn / Play / Test) -->
    <div id="workspaceModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4">
      <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[92vh] flex flex-col shadow-2xl border border-amber-200 overflow-hidden">
        <div class="bg-amber-600 text-white p-4 flex justify-between items-center">
          <div>
            <span id="wsModeBadge" class="bg-amber-800 text-[10px] uppercase font-black px-2 py-0.5 rounded-full">MODE</span>
            <h3 id="wsChapterTitle" class="text-lg font-bold mt-0.5">Title</h3>
          </div>
          <button id="closeWsBtn" class="text-white hover:bg-amber-700 w-8 h-8 rounded-full flex items-center justify-center font-bold text-lg">✕</button>
        </div>
        <div id="wsBody" class="p-5 sm:p-6 overflow-y-auto flex-1 space-y-5"></div>
      </div>
    </div>

    <!-- Homework Helper Modal -->
    <div id="hwModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4">
      <div class="bg-white rounded-3xl max-w-lg w-full max-h-[92vh] flex flex-col shadow-2xl border border-amber-200 overflow-hidden">
        <div class="bg-amber-600 text-white p-4 flex justify-between items-center">
          <div class="flex items-center gap-2">
            <span class="text-2xl">📷</span>
            <h3 id="uiHwTitle" class="text-lg font-bold">ঘৰুৱা কামৰ সহায়ক</h3>
          </div>
          <button id="closeHwBtn" class="text-white hover:bg-amber-700 w-8 h-8 rounded-full flex items-center justify-center font-bold text-lg">✕</button>
        </div>

        <div class="p-5 overflow-y-auto flex-1 space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <label class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-amber-400 bg-amber-50 hover:bg-amber-100 rounded-2xl cursor-pointer transition">
              <span class="text-3xl">📸</span>
              <span class="text-xs font-bold text-amber-900 mt-1" id="uiCaptureBtnText">ফটো তোলক</span>
              <input type="file" id="hwCameraInput" accept="image/*" capture="environment" class="hidden" />
            </label>

            <label class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-slate-300 bg-slate-50 hover:bg-slate-100 rounded-2xl cursor-pointer transition">
              <span class="text-3xl">📁</span>
              <span class="text-xs font-bold text-slate-700 mt-1" id="uiUploadBtnText">ফটো বাছক</span>
              <input type="file" id="hwFileInput" accept="image/*" class="hidden" />
            </label>
          </div>

          <div id="hwImagePreviewContainer" class="hidden relative rounded-xl overflow-hidden border border-slate-200">
            <img id="hwImagePreview" src="" alt="Homework Preview" class="w-full max-h-48 object-contain bg-slate-100" />
            <button id="hwRemoveImgBtn" class="absolute top-2 right-2 bg-slate-900/70 text-white p-1 rounded-full text-xs">✕</button>
          </div>

          <textarea id="hwTextInput" rows="3" placeholder="বা ইয়াত আপোনাৰ অংকটো টাইপ কৰক..." 
                    class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5" id="uiHwModeSelectLabel">সহায়ৰ ধৰণ বাছক:</label>
            <div class="grid grid-cols-3 gap-2">
              <button class="hw-type-btn p-2 rounded-xl border border-amber-300 text-xs font-bold text-amber-950 bg-amber-50 active-hw-type" data-type="hint" id="uiHwOptHint">ইংগিত</button>
              <button class="hw-type-btn p-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 bg-white" data-type="step" id="uiHwOptStep">স্তৰে স্তৰে</button>
              <button class="hw-type-btn p-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 bg-white" data-type="check" id="uiHwOptCheck">পৰীক্ষা</button>
            </div>
          </div>

          <button id="askHwBtn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl transition shadow flex items-center justify-center gap-2 text-sm">
            <span>✨</span> <span id="uiAskBtnText">সহায় বিচাৰক</span>
          </button>

          <div id="hwOutput" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm leading-relaxed space-y-2"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Step-by-Step Onboarding Gateway -->
  <div id="onboardingPortal" class="fixed inset-0 bg-amber-600/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border-4 border-amber-300 text-center">
      
      <!-- Screen 1: Language Selection -->
      <div id="onboardingStepLang">
        <span class="text-5xl inline-block mb-3">🌐</span>
        <h2 class="text-2xl font-black text-slate-900">Choose Language / ভাষা বাছক</h2>
        <p class="text-xs text-slate-600 mt-1 mb-6">
          আপুনি কোনটো ভাষাত গণিত শিকিব বিচাৰে?<br/>Which language do you prefer to learn mathematics in?
        </p>

        <div class="grid grid-cols-2 gap-3">
          <button id="chooseLangAsBtn" class="p-4 rounded-2xl border-2 border-amber-400 bg-amber-50 hover:bg-amber-100 font-black text-amber-950 transition transform active:scale-95 flex flex-col items-center gap-1 shadow-sm">
            <span class="text-2xl">অ</span>
            <span class="text-base font-bold">অসমীয়া</span>
          </button>

          <button id="chooseLangEnBtn" class="p-4 rounded-2xl border-2 border-slate-300 bg-slate-50 hover:bg-slate-100 font-black text-slate-800 transition transform active:scale-95 flex flex-col items-center gap-1 shadow-sm">
            <span class="text-2xl font-bold">En</span>
            <span class="text-base font-bold">English</span>
          </button>
        </div>
      </div>

      <!-- Screen 2A: Direct Handover to Gemini Key -->
      <div id="onboardingStepKeyRedirect" class="hidden">
        <span class="text-6xl animate-bounce inline-block mb-3">🔑</span>
        <h2 class="text-2xl font-black text-slate-900" id="portalKeyTitle">Google Gemini Key প্ৰয়োজন</h2>
        <p class="text-xs sm:text-sm text-slate-600 mt-2 leading-relaxed" id="portalKeyDesc"></p>

        <button id="directRedirectBtn" class="mt-6 w-full bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-700 hover:to-orange-700 text-white font-black py-3.5 px-4 rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2 text-sm sm:text-base">
          <span>🚀</span> <span id="redirectBtnText">মোক Key পৃষ্ঠালৈ লৈ যাওক</span>
        </button>
        <button id="skipToPasteBtn" type="button" class="mt-3 w-full text-xs text-amber-800 font-bold hover:underline py-2 text-center">
          মোৰ ওচৰত ইতিমধ্যে Key আছে (I already have a key) &rarr;
        </button>
      </div>

      <!-- Screen 2B: Returning to Paste Key -->
      <div id="onboardingStepKeyPaste" class="hidden">
        <span class="text-5xl inline-block mb-2">📋</span>
        <h3 class="text-xl font-black text-slate-900" id="portalPasteTitle">Key পেষ্ট কৰক</h3>
        <p class="text-xs text-slate-600 mt-1" id="portalPasteDesc"></p>

        <div class="mt-4">
          <input type="password" id="geminiKeyInput" placeholder="AIzaSy..." 
                 class="w-full px-4 py-3 bg-slate-50 border-2 border-amber-400 rounded-xl font-mono text-sm focus:ring-4 focus:ring-amber-200 focus:outline-none text-center" />
        </div>

        <div id="portalFeedback" class="hidden mt-3 p-2.5 rounded-xl text-xs font-bold"></div>

        <div class="mt-4 flex flex-col gap-2">
          <button id="saveAndLaunchBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl shadow-md transition transform active:scale-95 text-sm flex items-center justify-center gap-2">
            <span>✨</span> <span id="launchBtnText">পৰীক্ষা কৰি এপ খোলক</span>
          </button>
          
          <button id="reopenGoogleBtn" class="text-xs text-amber-700 font-bold hover:underline py-1">
            <span id="reopenGoogleBtnText">↺ পুনৰ Google AI Studio লৈ যাওক</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- APPLICATION ENGINE (SELF-CONTAINED) -->
  <script>
    const AI_STUDIO_URL = "https://aistudio.google.com/app/apikey";

    const strings = {
      as: {
        brandTitle: "গণিত পাঠশালা",
        brandTagline: "স্পৰ্শ কৰা, খেলা আৰু শিকা",
        searchPlaceholder: "যিকোনো গাণিতিক ধাৰণা অনুসন্ধান কৰক (যেনে: ভগ্নাংশ, সমীকৰণ)...",
        selectClassLabel: "শ্ৰেণী বা পৰ্যায় বাছক:",
        hwNavText: "ঘৰুৱা কাম",
        learnBtn: "শিকক",
        playBtn: "খেলক",
        testBtn: "পৰীক্ষা",
        portalKeyTitle: "Google Gemini Key প্ৰয়োজন",
        portalKeyDesc: "গণিত পাঠশালা ব্যৱহাৰ কৰিবলৈ আপোনাক এতিয়া Google ৰ বিনামূলীয়া Gemini Key পৃষ্ঠালৈ লৈ যোৱা হ’ব। তাত Key টো বনাই কপি কৰি পুনৰ ইয়ালৈ ঘূৰি আহক।",
        redirectBtnText: "মোক Key পৃষ্ঠালৈ লৈ যাওক",
        portalPasteTitle: "Key পেষ্ট কৰক",
        portalPasteDesc: "Google AI Studio ৰ পৰা কপি কৰি অনা Key টো তলৰ বাকচত পেষ্ট কৰক:",
        launchBtnText: "পৰীক্ষা কৰি এপ আৰম্ভ কৰক",
        reopenGoogleBtnText: "↺ পুনৰ Google AI Studio লৈ যাওক",
        keyInvalid: "ভুল Key! Gemini Key সাধাৰণতে 'AIza' ৰে আৰম্ভ হয়।",
        verifyingKey: "Key পৰীক্ষা কৰি থকা হৈছে...",
        keyValid: "✓ সংযোগ সফল হ’ল! গণিত পাঠশালালৈ স্বাগতম!",
        keyFailed: "সংযোগ বিফল হ’ল। অনুগ্ৰহ কৰি সঠিক Key দিয়ক।",
        hwTitle: "ঘৰুৱা কামৰ সহায়ক",
        captureBtn: "ফটো তোলক",
        uploadBtn: "ফটো বাছক",
        hwPlaceholder: "বা ইয়াত আপোনাৰ অংকটো টাইপ কৰক...",
        hwModeLabel: "সহায়ৰ ধৰণ বাছক:",
        hwHint: "ইংগিত",
        hwStep: "স্তৰে স্তৰে",
        hwCheck: "পৰীক্ষা",
        askBtn: "সহায় বিচাৰক",
        analyzingHw: "AI গুৰুৱে অংকটো বিশ্লেষণ কৰি আছে...",
        rescueTitle: "বাঃ, আপুনি প্ৰায় সমাধানৰ ওচৰ পাইছিলগৈ!",
        tryAgainGuidance: "আহকচোন, এই খোজটো একেলগে পুনৰ পৰীক্ষা কৰোঁ:"
      },
      en: {
        brandTitle: "Gonit Pathshala",
        brandTagline: "Touch, Play and Master Mathematics",
        searchPlaceholder: "Search any math concept (e.g., Fractions, Linear Equations)...",
        selectClassLabel: "Select Grade / Level:",
        hwNavText: "Homework Help",
        learnBtn: "Learn",
        playBtn: "Play",
        testBtn: "Test",
        portalKeyTitle: "Google Gemini Key Required",
        portalKeyDesc: "To experience Gonit Pathshala, you will now be taken directly to Google to create your free Gemini API Key. Copy your key there and return to this tab.",
        redirectBtnText: "Take me to my Key Page",
        portalPasteTitle: "Paste Your Key",
        portalPasteDesc: "Paste the key you copied from Google AI Studio below:",
        launchBtnText: "Verify Key & Launch App",
        reopenGoogleBtnText: "↺ Open Google AI Studio again",
        keyInvalid: "Invalid Key format. Gemini keys begin with 'AIza'.",
        verifyingKey: "Verifying connection...",
        keyValid: "✓ Success! Welcome to Gonit Pathshala!",
        keyFailed: "Verification failed. Please check your key.",
        hwTitle: "Homework Helper",
        captureBtn: "Take Photo",
        uploadBtn: "Upload Photo",
        hwPlaceholder: "Or type your math problem here...",
        hwModeLabel: "Choose Assistance Level:",
        hwHint: "Hint",
        hwStep: "Step-by-Step",
        hwCheck: "Check My Work",
        askBtn: "Get Assistance",
        analyzingHw: "AI Guru is analyzing the problem...",
        rescueTitle: "Great try! You were super close!",
        tryAgainGuidance: "Let's examine this specific step together:"
      }
    };

    const asDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];

    window.currentLang = localStorage.getItem('omnimath_lang') || 'as';
    window.apiKey = localStorage.getItem('omnimath_gemini_key') || '';
    let currentClassId = 'class-1';
    let currentHwImageBase64 = null;
    let currentHwType = "hint";

    function t(key) {
      const lang = window.currentLang || 'as';
      return (strings[lang] && strings[lang][key]) || (strings['en'] && strings['en'][key]) || key;
    }

    window.toDigits = function(num) {
      if (window.currentLang === 'en' || num === null || num === undefined) return String(num);
      return String(num).replace(/\d/g, d => asDigits[d]);
    };

    window.addEventListener('DOMContentLoaded', () => {
      setupUI();

      const savedLang = localStorage.getItem('omnimath_lang');
      const savedKey = localStorage.getItem('omnimath_gemini_key');
      const onboardingPortal = document.getElementById('onboardingPortal');

      if (savedKey && savedKey.length >= 20) {
        window.apiKey = savedKey;
        window.currentLang = savedLang || 'as';
        document.documentElement.lang = window.currentLang;
        applyStaticTranslations();
        if (onboardingPortal) {
          onboardingPortal.classList.add('hidden');
          onboardingPortal.style.display = 'none';
        }
        bootDashboard();
        return;
      }

      if (onboardingPortal) {
        onboardingPortal.classList.remove('hidden');
        onboardingPortal.style.display = 'flex';
      }
    });

    function setupUI() {
      // Language Selection in Modal
      const btnAs = document.getElementById('chooseLangAsBtn');
      const btnEn = document.getElementById('chooseLangEnBtn');
      if (btnAs) btnAs.onclick = () => selectLang('as');
      if (btnEn) btnEn.onclick = () => selectLang('en');

      // Header Lang Toggle
      const langToggle = document.getElementById('langToggleBtn');
      if (langToggle) {
        langToggle.onclick = () => {
          selectLang(window.currentLang === 'as' ? 'en' : 'as');
          bootDashboard();
        };
      }

      // Direct Redirect to AI Studio
      const redirectBtn = document.getElementById('directRedirectBtn');
      if (redirectBtn) {
        redirectBtn.onclick = () => {
          sessionStorage.setItem('omnimath_redirected', 'true');
          window.open(AI_STUDIO_URL, '_blank');
          showKeyPasteScreen();
        };
      }

      const skipBtn = document.getElementById('skipToPasteBtn');
      if (skipBtn) skipBtn.onclick = () => showKeyPasteScreen();

      const reopenBtn = document.getElementById('reopenGoogleBtn');
      if (reopenBtn) {
        reopenBtn.onclick = () => {
          window.open(AI_STUDIO_URL, '_blank');
        };
      }

      const saveBtn = document.getElementById('saveAndLaunchBtn');
      if (saveBtn) saveBtn.onclick = verifyAndLaunch;

      // Detect return from Google tab
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && !window.apiKey) {
          if (sessionStorage.getItem('omnimath_redirected') === 'true') {
            showKeyPasteScreen();
          }
        }
      });

      const classDropdown = document.getElementById('classSelectDropdown');
      if (classDropdown) {
        classDropdown.onchange = (e) => {
          currentClassId = e.target.value;
          renderChapterCards();
        };
      }

      const searchInput = document.getElementById('conceptSearchInput');
      if (searchInput) {
        searchInput.oninput = handleUniversalSearch;
      }

      renderClassSelector();
      renderChapterCards();

      // Homework Modal Triggers
      const openHw = document.getElementById('openHwBtn');
      const closeHw = document.getElementById('closeHwBtn');
      const closeWs = document.getElementById('closeWsBtn');
      if (openHw) openHw.onclick = () => document.getElementById('hwModal')?.classList.remove('hidden');
      if (closeHw) closeHw.onclick = () => document.getElementById('hwModal')?.classList.add('hidden');
      if (closeWs) closeWs.onclick = () => window.closeTopicWorkspace();

      // Homework File Upload
      const cam = document.getElementById('hwCameraInput');
      const file = document.getElementById('hwFileInput');
      const remImg = document.getElementById('hwRemoveImgBtn');
      if (cam) cam.onchange = handleHwImage;
      if (file) file.onchange = handleHwImage;
      if (remImg) remImg.onclick = clearHwImage;

      // Homework Help Type Toggles
      document.querySelectorAll('.hw-type-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.hw-type-btn').forEach(b => b.classList.remove('active-hw-type'));
          btn.classList.add('active-hw-type');
          currentHwType = btn.getAttribute('data-type');
        };
      });

      const askBtn = document.getElementById('askHwBtn');
      if (askBtn) askBtn.onclick = submitHomeworkQuery;
    }

    function selectLang(lang) {
      window.currentLang = lang;
      localStorage.setItem('omnimath_lang', lang);
      document.documentElement.lang = lang;
      applyStaticTranslations();

      const savedKey = localStorage.getItem('omnimath_gemini_key');
      const onboardingPortal = document.getElementById('onboardingPortal');
      const langScreen = document.getElementById('onboardingStepLang');

      if (savedKey && savedKey.length >= 20) {
        window.apiKey = savedKey;
        if (onboardingPortal) {
          onboardingPortal.classList.add('hidden');
          onboardingPortal.style.display = 'none';
        }
        bootDashboard();
      } else {
        if (langScreen) langScreen.classList.add('hidden');
        showKeyRedirectScreen();
      }
    }

    function showKeyRedirectScreen() {
      const pasteScreen = document.getElementById('onboardingStepKeyPaste');
      const redirectScreen = document.getElementById('onboardingStepKeyRedirect');
      if (pasteScreen) pasteScreen.classList.add('hidden');
      if (redirectScreen) redirectScreen.classList.remove('hidden');

      const title = document.getElementById('portalKeyTitle');
      const desc = document.getElementById('portalKeyDesc');
      const btn = document.getElementById('redirectBtnText');

      if (title) title.innerText = t('portalKeyTitle');
      if (desc) desc.innerText = t('portalKeyDesc');
      if (btn) btn.innerText = t('redirectBtnText');
    }

    function showKeyPasteScreen() {
      document.getElementById('onboardingStepKeyRedirect')?.classList.add('hidden');
      const pasteScreen = document.getElementById('onboardingStepKeyPaste');
      if (pasteScreen) pasteScreen.classList.remove('hidden');

      document.getElementById('portalPasteTitle').innerText = t('portalPasteTitle');
      document.getElementById('portalPasteDesc').innerText = t('portalPasteDesc');
      document.getElementById('launchBtnText').innerText = t('launchBtnText');
      document.getElementById('reopenGoogleBtnText').innerText = t('reopenGoogleBtnText');

      setTimeout(() => document.getElementById('geminiKeyInput')?.focus(), 250);
    }

    async function verifyAndLaunch() {
      const input = document.getElementById('geminiKeyInput');
      const feedback = document.getElementById('portalFeedback');
      const btn = document.getElementById('saveAndLaunchBtn');
      const key = input.value.trim();

      feedback.classList.remove('hidden');

      if (!key || key.length < 20) {
        feedback.className = "mt-3 p-2.5 rounded-xl text-xs font-bold bg-rose-100 text-rose-800 text-center";
        feedback.innerText = t('keyInvalid');
        return;
      }

      feedback.className = "mt-3 p-2.5 rounded-xl text-xs font-bold bg-amber-100 text-amber-800 text-center";
      feedback.innerText = t('verifyingKey');
      btn.disabled = true;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`, {
          method: 'GET',
          headers: {
            'x-goog-api-key': key,
            'Content-Type': 'application/json'
          }
        });
        const data = await res.json();

        if (res.ok) {
          window.apiKey = key;
          localStorage.setItem('omnimath_gemini_key', key);
          sessionStorage.removeItem('omnimath_redirected');

          feedback.className = "mt-3 p-2.5 rounded-xl text-xs font-bold bg-emerald-100 text-emerald-800 text-center";
          feedback.innerText = t('keyValid');

          setTimeout(() => {
            const portal = document.getElementById('onboardingPortal');
            if (portal) {
              portal.classList.add('hidden');
              portal.style.display = 'none';
            }
            btn.disabled = false;
            bootDashboard();
          }, 700);
        } else {
          btn.disabled = false;
          const apiErr = data.error?.message || `Error ${res.status}: ${res.statusText}`;
          feedback.className = "mt-3 p-2.5 rounded-xl text-xs font-bold bg-rose-100 text-rose-800 text-center break-words";
          feedback.innerText = apiErr;
        }
      } catch (err) {
        btn.disabled = false;
        feedback.className = "mt-3 p-2.5 rounded-xl text-xs font-bold bg-rose-100 text-rose-800 text-center break-words";
        feedback.innerText = err.message || "Network error reaching Google API";
      }
    }

    function applyStaticTranslations() {
      const brandTitle = document.getElementById('uiBrandTitle');
      const brandTag = document.getElementById('uiBrandTagline');
      const langLbl = document.getElementById('currentLangLabel');
      const sInput = document.getElementById('conceptSearchInput');
      const selCls = document.getElementById('uiSelectClassLabel');
      const hwNav = document.getElementById('uiHwNavText');
      const hwTitle = document.getElementById('uiHwTitle');
      const capBtn = document.getElementById('uiCaptureBtnText');
      const upBtn = document.getElementById('uiUploadBtnText');
      const hwInput = document.getElementById('hwTextInput');
      const hwMode = document.getElementById('uiHwModeSelectLabel');
      const hwHint = document.getElementById('uiHwOptHint');
      const hwStep = document.getElementById('uiHwOptStep');
      const hwChk = document.getElementById('uiHwOptCheck');
      const askBtn = document.getElementById('uiAskBtnText');

      if (brandTitle) brandTitle.innerText = t('brandTitle');
      if (brandTag) brandTag.innerText = t('brandTagline');
      if (langLbl) langLbl.innerText = window.currentLang === 'as' ? 'English' : 'অসমীয়া';
      if (sInput) sInput.placeholder = t('searchPlaceholder');
      if (selCls) selCls.innerText = t('selectClassLabel');
      if (hwNav) hwNav.innerText = t('hwNavText');
      if (hwTitle) hwTitle.innerText = t('hwTitle');
      if (capBtn) capBtn.innerText = t('captureBtn');
      if (upBtn) upBtn.innerText = t('uploadBtn');
      if (hwInput) hwInput.placeholder = t('hwPlaceholder');
      if (hwMode) hwMode.innerText = t('hwModeLabel');
      if (hwHint) hwHint.innerText = t('hwHint');
      if (hwStep) hwStep.innerText = t('hwStep');
      if (hwChk) hwChk.innerText = t('hwCheck');
      if (askBtn) askBtn.innerText = t('askBtn');
    }

    function renderClassSelector() {
      const select = document.getElementById('classSelectDropdown');
      if (!select || !window.MATH_CURRICULUM) return;
      select.innerHTML = '';
      window.MATH_CURRICULUM.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.label[window.currentLang] || c.label.en;
        if (c.id === currentClassId) opt.selected = true;
        select.appendChild(opt);
      });
    }
function handleCardClick(btn, mode) {
  const title = decodeURIComponent(btn.getAttribute('data-title'));
  const standard = decodeURIComponent(btn.getAttribute('data-class'));
  const topicId = btn.getAttribute('data-id') || '';
  window.openWorkspaceForTopic(title, standard, mode, topicId);
}
    
    function renderChapterCards() {
      const container = document.getElementById('chaptersContainer');
      if (!container || !window.MATH_CURRICULUM) return;
      container.innerHTML = '';

      const cls = window.MATH_CURRICULUM.find(c => c.id === currentClassId) || window.MATH_CURRICULUM[0];
      if (!cls) return;

            const renderTopicList = (topics, streamTitle) => {
        let html = '';
        if (streamTitle) {
          html += `<div class="col-span-full mt-4 mb-2"><h3 class="text-sm font-black text-amber-900 uppercase tracking-wider bg-amber-200/60 px-3 py-1 rounded-lg inline-block">${streamTitle}</h3></div>`;
        }
        topics.forEach(t => {
          const titleStr = t.title[window.currentLang] || t.title.en;
          const classTitle = cls.label[window.currentLang] || cls.label.en;
          html += `
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-amber-200 hover:shadow-md transition-shadow flex flex-col justify-between">
              <div>
                <span class="text-[10px] font-black uppercase text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">${classTitle}</span>
                <h3 class="font-bold text-slate-800 text-base mt-2">${titleStr}</h3>
              </div>
              <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-slate-100">
                <button onclick="handleCardClick(this, 'learn')" data-title="${encodeURIComponent(titleStr)}" data-class="${encodeURIComponent(classTitle)}" data-id="${t.id}" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-1.5 rounded-xl text-xs">Learn</button>
                <button onclick="handleCardClick(this, 'play')" data-title="${encodeURIComponent(titleStr)}" data-class="${encodeURIComponent(classTitle)}" data-id="${t.id}" class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold py-1.5 rounded-xl text-xs">Play</button>
                <button onclick="handleCardClick(this, 'test')" data-title="${encodeURIComponent(titleStr)}" data-class="${encodeURIComponent(classTitle)}" data-id="${t.id}" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-1.5 rounded-xl text-xs">Test</button>
              </div>
            </div>
          `;
        });
        return html;
      };
      

      if (cls.topics) {
        container.innerHTML = renderTopicList(cls.topics, null);
      } else if (cls.streams) {
        let fullHtml = '';
        cls.streams.forEach(s => {
          fullHtml += renderTopicList(s.topics, s.streamName[window.currentLang] || s.streamName.en);
        });
        container.innerHTML = fullHtml;
      }
    }

    function bootDashboard() {
      const keyPortal = document.getElementById('onboardingPortal');
      if (keyPortal) {
        keyPortal.classList.add('hidden');
        keyPortal.style.display = 'none';
      }

      applyStaticTranslations();
      renderClassSelector();
      renderChapterCards();
    }

    function handleUniversalSearch(e) {
      const query = e.target.value.trim().toLowerCase();
      const dropdown = document.getElementById('searchResultsDropdown');

      if (!dropdown) return;

      if (query.length < 2) {
        dropdown.classList.add('hidden');
        dropdown.innerHTML = '';
        return;
      }

      if (!window.MATH_CURRICULUM) return;

      const results = [];
      window.MATH_CURRICULUM.forEach(c => {
        const classTitle = c.label[window.currentLang] || c.label.en;
        const topicList = c.topics || (c.streams ? c.streams.flatMap(s => s.topics) : []);
        topicList.forEach(t => {
          const titleAs = (t.title.as || '').toLowerCase();
          const titleEn = (t.title.en || '').toLowerCase();
          if (titleAs.includes(query) || titleEn.includes(query)) {
            results.push({ ...t, classTitle, titleDisplay: t.title[window.currentLang] || t.title.en });
          }
        });
      });

      if (results.length === 0) {
        dropdown.innerHTML = `<div class="p-4 text-xs text-slate-500 text-center">কোনো ধাৰণা পোৱা নগ'ল / No concept found</div>`;
      } else {
        dropdown.innerHTML = results.map(r => `
          <div class="search-result-item p-3 border-b border-slate-100 hover:bg-amber-50 cursor-pointer flex justify-between items-center" data-title="${r.titleDisplay}" data-class="${r.classTitle}" data-id="${r.id}">
            <div>
              <h5 class="text-sm font-bold text-slate-900">${r.titleDisplay}</h5>
              <span class="text-[10px] text-amber-700 font-semibold uppercase">${r.classTitle}</span>
            </div>
            <span class="text-xs text-amber-700 font-bold">খোলক &rarr;</span>
          </div>
        `).join('');

        dropdown.querySelectorAll('.search-result-item').forEach(item => {
          item.onclick = () => {
            dropdown.classList.add('hidden');
            window.openWorkspaceForTopic(item.getAttribute('data-title'), item.getAttribute('data-class'), 'learn', item.getAttribute('data-id'));
          };
        });
      }

      dropdown.classList.remove('hidden');
    }

    function handleHwImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        currentHwImageBase64 = event.target.result.split(',')[1];
        document.getElementById('hwImagePreview').src = event.target.result;
        document.getElementById('hwImagePreviewContainer')?.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function clearHwImage() {
      currentHwImageBase64 = null;
      document.getElementById('hwImagePreviewContainer')?.classList.add('hidden');
      const cam = document.getElementById('hwCameraInput');
      const file = document.getElementById('hwFileInput');
      if (cam) cam.value = '';
      if (file) file.value = '';
    }

    async function submitHomeworkQuery() {
      const text = document.getElementById('hwTextInput')?.value.trim();
      const output = document.getElementById('hwOutput');
      const btn = document.getElementById('askHwBtn');

      if (!text && !currentHwImageBase64) return;
      if (output) {
        output.classList.remove('hidden');
        output.innerHTML = `<span class="animate-pulse font-bold text-amber-800">⚡ ${t('analyzingHw')}</span>`;
      }
      if (btn) btn.disabled = true;

      const langRule = window.currentLang === 'as'
        ? "Respond purely and strictly in Assamese. Use formal terminology (যেনে: অৱকলন, সমীকৰণ, ভগ্নাংশ). Do not include English words unless formulas."
        : "Respond purely and strictly in English with professional mathematical clarity. Do not mix any other language.";

      let modeRule = currentHwType === "hint"
        ? "Give only a concise conceptual clue and the formula. Do not provide final answer."
        : currentHwType === "step"
        ? "Derive step-by-step using LaTeX syntax ($...$) for formulas."
        : "Evaluate student working. Explain where the logic slipped constructively.";

      const promptText = `OmniMath Guru. ${langRule} ${modeRule} Problem: ${text || 'Please analyze attached image.'}`;
      const contentsParts = [{ text: promptText }];
      if (currentHwImageBase64) {
        contentsParts.push({ inline_data: { mime_type: "image/jpeg", data: currentHwImageBase64 } });
      }

      const candidateModels = [
        'gemini-flash-latest',
        'gemini-3.5-flash-lite',
        'gemini-3.5-flash',
        'gemini-2.5-flash',
        'gemini-3.8-flash'
      ];

      let candidateText = null;

      for (const model of candidateModels) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${window.apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: contentsParts }] })
          });

          if (!res.ok) continue;

          const data = await res.json();
          const textRes = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (textRes) {
            candidateText = textRes;
            break;
          }
        } catch (e) {
          // Fall through to next model
        }
      }

      if (output) {
        if (candidateText) {
          output.innerHTML = candidateText.replace(/\\n/g, '<br/>');
          if (window.renderMathInElement) {
            renderMathInElement(output, { 
              delimiters: [
                { left: '$$', right: '$$', display: true }, 
                { left: '$', right: '$', display: false }
              ] 
            });
          }
        } else {
          output.innerHTML = `<span class="text-rose-700 font-bold">${window.currentLang === 'as' ? 'সংযোগত সমস্যা হ’ল। অনুগ্ৰহ কৰি পুনৰ চেষ্টা কৰক।' : 'Connection error. Please try again.'}</span>`;
        }
      }

      if (btn) btn.disabled = false;
    }
  </script>

  <!-- EXTERNAL SCRIPTS WITH DYNAMIC CACHE-BUSTING -->
  <script src="js/curriculum.js?v=60"></script>
  
  <!-- Dynamic auto-busting loader for ai-engine -->
  <script>
    (function() {
      const script = document.createElement('script');
      // Appends current timestamp so mobile browsers NEVER use a cached stale file
      script.src = 'js/ai-engine.js?t=' + Date.now();
      document.body.appendChild(script);
    })();
  </script>

  <!-- REFRESH ENGINE HELPER -->
  <script>
    async function forceAppRefresh() {
      try {
        // 1. Clear Service Worker & PWA Cache
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        // 2. Clear old cached AI lessons in localStorage
        Object.keys(localStorage).forEach(key => {
          if (key.startsWith('gp_lesson_')) {
            localStorage.removeItem(key);
          }
        });
      } catch (e) {
        console.warn('Cache clearing warning:', e);
      }
      // 3. Force browser hard reload from server
      window.location.reload(true);
    }
  </script>

  <!-- MODAL CONTROLLER -->
  <script>
    window.openWorkspaceForTopic = function(title, standard, mode, topicId) {
      window.activeTopicContext = { title: title || '', standard: standard || '', topicId: topicId || '' };
      
      if (typeof practiceStreak !== 'undefined') practiceStreak = 0;
      if (typeof testQuestions !== 'undefined') testQuestions = [];
      if (typeof currentTestIndex !== 'undefined') currentTestIndex = 0;
      if (typeof testScore !== 'undefined') testScore = 0;

      const modal = document.getElementById('workspaceModal');
      const titleEl = document.getElementById('wsChapterTitle');
      const badgeEl = document.getElementById('wsModeBadge');
      const bodyEl = document.getElementById('wsBody');
      const closeBtn = document.getElementById('closeWsBtn');

      if (titleEl) titleEl.innerText = title || 'Mathematics';
      if (badgeEl) badgeEl.innerText = (mode || 'PRACTICE').toUpperCase();

      if (closeBtn) {
        closeBtn.onclick = window.closeTopicWorkspace;
      }

      if (modal) {
        modal.classList.remove('hidden');
        modal.style.display = 'flex';
      }

      if (bodyEl) {
        if (mode === 'test' && typeof renderTestSetup === 'function') {
          renderTestSetup(bodyEl);
        } else if (mode === 'learn' && typeof renderLearnMode === 'function') {
          renderLearnMode(bodyEl);
        } else if (typeof renderPracticeArena === 'function') {
          renderPracticeArena(bodyEl);
        } else {
          bodyEl.innerHTML = `<p class="text-center text-slate-500 font-bold p-6">Loading workspace...</p>`;
        }
      }
    };

    window.closeTopicWorkspace = function() {
      const modal = document.getElementById('workspaceModal');
      if (modal) {
        modal.classList.add('hidden');
        modal.style.display = 'none';
      }
    };
  </script>
